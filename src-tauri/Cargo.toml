[package]
name = "casa"
version = "0.1.0"
description = "Home assistant: LAN discovery, devices, automations"
edition = "2021"

[lib]
name = "casa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rsa = "0.9"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
sha1 = "0.11"
base64 = "0.23"

[profile.release]
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
axum = "0.8"

# Debug builds of the bignum code behind RSA-1024 keygen are unusably slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
